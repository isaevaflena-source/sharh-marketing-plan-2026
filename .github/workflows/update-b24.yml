name: Update Bitrix24 marketing facts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Read Bitrix24 and build public facts
        env:
          BITRIX_WEBHOOK_URL: ${{ secrets.BITRIX_WEBHOOK_URL }}
        run: node update-b24.mjs
      - name: Publish changed facts
        run: |
          git config user.name "SHARH B24 Sync"
          git config user.email "actions@users.noreply.github.com"
          git add marketing-b24.json
          git diff --cached --quiet || git commit -m "Update Bitrix24 marketing facts"
          git push
